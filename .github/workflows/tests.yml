name: ShipCheck CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run unit & marker tests
      run: |
        pytest tests/test_markers.py tests/test_json_extract.py tests/test_patcher.py tests/test_risk.py -v

    - name: Run e2e fixture test (offline mock / local sandbox)
      run: |
        pytest tests/e2e/test_vulnshop_sqli.py -v
