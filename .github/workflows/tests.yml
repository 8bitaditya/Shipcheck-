name: ShipCheck CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run contract tests
      run: |
        pytest tests/test_contracts.py -v

    - name: Run sandbox tests (local backend)
      run: |
        pytest tests/test_sandbox.py -v

    - name: Run probe harness tests
      run: |
        pytest tests/test_probe_harness.py -v

    - name: Run triage tests
      run: |
        pytest tests/test_triage.py -v

    - name: Run ConTree backend tests (fake image)
      run: |
        pytest tests/test_contree_backend.py -v

    - name: Run Docker backend tests (skip unless SHIPCHECK_DOCKER=1)
      run: |
        pytest tests/test_docker_backend.py -v

    - name: Run attack planner tests
      run: |
        pytest tests/test_planner.py -v

    - name: Run Tavily grounding tests (FR-5)
      run: |
        pytest tests/test_grounding.py -v

    - name: Run rectification tests (FR-6)
      run: |
        pytest tests/test_rectify.py -v

    - name: Run orchestrator tests
      run: |
        pytest tests/test_orchestrator.py -v

    - name: Run PR bot tests (FR-7)
      run: |
        pytest tests/test_pr_bot.py -v

    - name: Run API tests (FR-8)
      run: |
        pytest tests/test_api.py -v
